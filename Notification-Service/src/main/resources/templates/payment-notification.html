<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #4CAF50; color: white; padding: 10px 20px; text-align: center; }
        .header.expired { background-color: #ff9800; }
        .content { padding: 20px; border: 1px solid #ddd; }
        .order-id { font-size: 18px; font-weight: bold; }
        .price { font-size: 16px; color: #4CAF50; font-weight: bold; }
        .footer { margin-top: 20px; font-size: 12px; color: #777; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" th:classappend="${type == 'expirado' ? 'expired' : ''}">
            <h1 th:if="${type == 'confirmado'}">Pagamento Confirmado!</h1>
            <h1 th:if="${type == 'expirado'}">Pagamento Expirado</h1>
        </div>
        <div class="content">
            <p>Olá,</p>
            <p th:if="${type == 'confirmado'}">
                O pagamento do pedido <span class="order-id" th:text="${orderId}"></span> foi <strong>confirmado</strong>!
            </p>
            <p th:if="${type == 'expirado'}">
                O pagamento do pedido <span class="order-id" th:text="${orderId}"></span> <strong>expirou</strong>.
            </p>
            <p th:if="${totalPrice}">
                Valor total: <span class="price" th:text="'R$' + ${totalPrice}"></span>
            </p>
            <p>Agradecemos pela preferência!</p>
        </div>
        <div class="footer">
            <p>E-commerce Microsservices</p>
        </div>
    </div>
</body>
</html>
