<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #4CAF50; color: white; padding: 10px 20px; text-align: center; }
        .header.cancelled { background-color: #f44336; }
        .content { padding: 20px; border: 1px solid #ddd; }
        .order-id { font-size: 18px; font-weight: bold; }
        .footer { margin-top: 20px; font-size: 12px; color: #777; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header" th:classappend="${type == 'cancelado' ? 'cancelled' : ''}">
            <h1 th:if="${type == 'confirmado'}">Pedido Confirmado!</h1>
            <h1 th:if="${type == 'cancelado'}">Pedido Cancelado</h1>
        </div>
        <div class="content">
            <p>Olá,</p>
            <p th:if="${type == 'confirmado'}">
                Seu pedido <span class="order-id" th:text="${orderId}"></span> foi <strong>confirmado</strong> com sucesso!
            </p>
            <p th:if="${type == 'cancelado'}">
                Seu pedido <span class="order-id" th:text="${orderId}"></span> foi <strong>cancelado</strong>.
            </p>
            <p th:if="${reason}" th:text="'Motivo: ' + ${reason}"></p>
            <p>Agradecemos pela preferência!</p>
        </div>
        <div class="footer">
            <p>E-commerce Microsservices</p>
        </div>
    </div>
</body>
</html>
